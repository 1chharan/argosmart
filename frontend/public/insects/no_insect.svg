  <!-- Question mark / magnifying glass with no insect -->
  <circle cx="200" cy="140" r="50" fill="#0f172a" fill-opacity="0.6" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,6" />
  <text x="200" y="152" font-family="system-ui, sans-serif" font-size="34" fill="#fbbf24" text-anchor="middle" font-weight="900">?</text>
  <rect x="70" y="220" width="260" height="42" rx="10" fill="#022c22" fill-opacity="0.85" stroke="#10b981" stroke-width="2"/>
  <text x="200" y="247" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff" font-weight="800" text-anchor="middle">Only Leaf Visible • No Insect Found</text>
</svg>
