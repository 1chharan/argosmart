<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_grass)" rx="16" />
  <!-- Crop leaf blade only -->
  <path d="M50 280 Q 150 120 350 70 Q 260 210 120 280 Z" fill="#22c55e" opacity="0.8" />
