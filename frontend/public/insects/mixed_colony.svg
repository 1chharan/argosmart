<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="50%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#splitBg)" />
  <!-- Leaf background -->
  <path d="M20 100 Q100 30 180 100 Q100 170 20 100 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" opacity="0.6"/>

  <!-- Left: Honeybee (Helpful) -->
  <g transform="translate(-10, -10) scale(0.75)">
    <ellipse cx="90" cy="80" rx="30" ry="16" transform="rotate(-30 90 80)" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="100" cy="115" rx="20" ry="30" fill="#facc15" stroke="#78350f" stroke-width="2"/>
    <path d="M84 105 Q100 112 116 105 M82 118 Q100 125 118 118" stroke="#18181b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="85" r="14" fill="#451a03"/>
    <rect x="55" y="145" width="90" height="20" rx="10" fill="#15803d"/>
    <text x="100" y="159" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">🟢 Helpful Bee</text>
  </g>

  <!-- Right: Whitefly (Harmful) -->
  <g transform="translate(60, 10) scale(0.75)">
    <ellipse cx="110" cy="90" rx="28" ry="34" transform="rotate(-20 110 90)" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="130" cy="90" rx="28" ry="34" transform="rotate(20 130 90)" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="120" cy="95" rx="8" ry="20" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="120" cy="72" r="7" fill="#eab308"/>
    <circle cx="117" cy="70" r="2.5" fill="#dc2626"/>
    <rect x="80" y="125" width="85" height="20" rx="10" fill="#dc2626"/>
    <text x="122" y="139" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">🔴 Whitefly</text>
  </g>

  <!-- Bottom mixed alert badge -->
  <rect x="20" y="165" width="160" height="24" rx="12" fill="#d97706"/>
  <text x="100" y="181" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">🌾 Mixed Bugs: Do Not Spray</text>
</svg>
