<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="30" fill="#f0fdf4" />
  <!-- Host pest egg -->
  <circle cx="125" cy="120" r="32" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Parasitoid wasp perched on egg ovipositing -->
  <!-- Wings with fringe hairs -->
  <ellipse cx="68" cy="75" rx="32" ry="14" transform="rotate(-35 68 75)" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="112" cy="65" rx="32" ry="14" transform="rotate(30 112 65)" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" opacity="0.85"/>
  <!-- Tiny Wasp Body -->
  <ellipse cx="90" cy="100" rx="10" ry="22" transform="rotate(25 90 100)" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <circle cx="80" cy="80" r="10" fill="#451a03"/>
  <circle cx="76" cy="78" r="3" fill="#dc2626"/>
  <!-- Ovipositor stinging the pest egg -->
  <line x1="98" y1="114" x2="116" y2="124" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Elbowed Antennae -->
  <path d="M74 74 L62 65 L55 70" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Label badge -->
  <rect x="25" y="165" width="150" height="24" rx="12" fill="#15803d"/>
  <text x="100" y="181" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Helpful Parasitoid 🐝</text>
</svg>
