<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="laceWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="#f0fdf4" />
  <!-- Large delicate wings with venation -->
  <ellipse cx="65" cy="85" rx="55" ry="24" transform="rotate(-30 65 85)" fill="url(#laceWings)" stroke="#16a34a" stroke-width="1.5"/>
  <ellipse cx="135" cy="85" rx="55" ry="24" transform="rotate(30 135 85)" fill="url(#laceWings)" stroke="#16a34a" stroke-width="1.5"/>
  <ellipse cx="60" cy="115" rx="45" ry="18" transform="rotate(-20 60 115)" fill="url(#laceWings)" stroke="#16a34a" stroke-width="1.5"/>
  <ellipse cx="140" cy="115" rx="45" ry="18" transform="rotate(20 140 115)" fill="url(#laceWings)" stroke="#16a34a" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="100" cy="110" rx="10" ry="48" fill="#4ade80" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="100" cy="55" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <!-- Golden Eyes -->
  <circle cx="94" cy="53" r="4.5" fill="#eab308"/>
  <circle cx="106" cy="53" r="4.5" fill="#eab308"/>
  <!-- Long Antennae -->
  <path d="M96 45 Q75 18 45 20 M104 45 Q125 18 155 20" stroke="#15803d" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Label badge -->
  <rect x="25" y="165" width="150" height="24" rx="12" fill="#15803d"/>
  <text x="100" y="181" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Helpful Predator 🌿</text>
</svg>
