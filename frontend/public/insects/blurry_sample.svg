<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="heavy_blur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <linearGradient id="bg_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_dark)" rx="16" />
  <!-- Blurry silhouettes of unknown insect -->
  <g filter="url(#heavy_blur)">
    <circle cx="190" cy="140" r="45" fill="#f59e0b" opacity="0.6" />
    <ellipse cx="230" cy="130" rx="35" ry="18" fill="#ef4444" opacity="0.5" />
    <ellipse cx="150" cy="160" rx="30" ry="12" fill="#10b981" opacity="0.5" />
  </g>
  <rect x="50" y="220" width="300" height="42" rx="10" fill="#451a03" fill-opacity="0.9" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="247" font-family="system-ui, sans-serif" font-size="13" fill="#fef3c7" font-weight="800" text-anchor="middle">⚠️ Blurry / Unclear Photo (&lt;60% Confidence)</text>
</svg>
